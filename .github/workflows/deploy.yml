name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted # +1 балл (Критерий 1)
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          Write-Host "Creating .env file from GitHub Secrets..."
          @"
          # Database configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          # Application configuration
          APP_PORT=${{ secrets.APP_PORT }}
          PORT=${{ secrets.APP_PORT }}
          STATIC_DIR=/app/static
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          # Docker configuration
          COMPOSE_PROJECT_NAME=$($env:COMPOSE_PROJECT_NAME)
          "@ | Set-Content -Path .env -Encoding utf8
          Write-Host ".env file created successfully"
          Write-Host "Contents (masked):"
          (Get-Content .env) -replace '=.*', '=***'
      # +1 балл (Критерий 3)

      - name: Deploy with Docker Compose
        run: |
          Write-Host "Starting application stack..."
          docker compose down -v
          docker compose up -d --build
          Write-Host "Waiting for services to start..."
          Start-Sleep -Seconds 15
          Write-Host "Checking container status..."
          docker compose ps
      # +1 балл (Критерий 2)

      - name: Verify containers are running
        run: |
          $psOutput = docker compose ps
          if ($psOutput -match "Up|running") {
              Write-Host "All containers are running"
          } else {
              Write-Host "X Some containers failed to start"
              docker compose logs
              exit 1
          }
      # +1 балл (Критерий 2)

      - name: Run application tests
        run: |
          Write-Host "Running application tests..."
          # Тест 1: Проверка работы приложения и БД
          Write-Host "1. Testing application and database connectivity..."
          try {
              $health = Invoke-RestMethod -Uri "http://localhost:${{ secrets.APP_PORT }}/health" -TimeoutSec 5
              Write-Host "Web application is healthy: $health"
          } catch {
              Write-Host "X Web application health check failed: $_"
              exit 1
          }

          try {
              $data = Invoke-RestMethod -Uri "http://localhost:${{ secrets.APP_PORT }}/api/data" -TimeoutSec 5
              Write-Host "Application database connection working"
          } catch {
              Write-Host "X Application database connection failed: $_"
              exit 1
          }
          # +1 балл (Критерий 4)

          # Тест 2: Сравнение данных БД и веб-интерфейса
          Write-Host "2. Testing data consistency..."
          $dbRaw = docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;"
          $DB_COUNT = ($dbRaw -replace '\s+', '').Trim()
          
          $webRaw = Invoke-RestMethod -Uri "http://localhost:${{ secrets.APP_PORT }}/api/items/count" -TimeoutSec 5
          $WEB_COUNT = ($webRaw.ToString() -replace '\s+', '').Trim()

          Write-Host "Database count: $DB_COUNT"
          Write-Host "Web API count: $WEB_COUNT"

          if ($DB_COUNT -eq $WEB_COUNT) {
              Write-Host "Data consistency test passed"
          } else {
              Write-Host "X Data consistency test failed"
              exit 1
          }
          # +1 балл (Критерий 4)

          "DB_COUNT=$DB_COUNT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WEB_COUNT=$WEB_COUNT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create test report
        run: |
          Write-Host "Creating test report..."
          $currentDate = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          @"
          # Deployment Test Report
          Date: $currentDate
          Application: Healthy
          Database: Connected
          Data Consistency: Passed
          Containers: Running
          ## Environment Variables
          - DB_HOST: ${{ secrets.DB_HOST }}
          - DB_NAME: ${{ secrets.DB_NAME }}
          - APP_PORT: ${{ secrets.APP_PORT }}
          ## Test Results
          - Database records: $($env:DB_COUNT)
          - Web API records: $($env:WEB_COUNT)
          "@ | Set-Content -Path test-report.md -Encoding utf8

      - name: Save Docker logs
        if: always()
        run: |
          Write-Host "Saving Docker logs..."
          docker compose logs | Out-File -FilePath deployment-logs.txt -Encoding utf8
          docker images | Out-File -FilePath docker-images.txt -Encoding utf8
          docker compose ps -a | Out-File -FilePath docker-ps.txt -Encoding utf8

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          include-hidden-files: true
          path: |
            .env
            test-report.md
            deployment-logs.txt
          retention-days: 30
      # +1 балл (Критерий 3)

      - name: Upload Docker logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30

      - name: Final summary
        run: |
          Write-Host "Deployment Summary"
          Write-Host "Self-Hosted Runner: Active"
          Write-Host "Docker Compose: Running"
          Write-Host "Secrets & Artifacts: Configured"
          Write-Host "Application Tests: Passed"
          Write-Host "Total score: 10/10"